services:
  - type: web
    name: afterlink
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -w @afterlink/relay
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AFTERLINK_WEB_DIST
        value: apps/web/dist
      - key: AFTERLINK_WEB_ORIGIN
        value: https://shafir-01.github.io
      - key: VITE_SITE_URL
        value: https://afterlink.onrender.com/
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: N8N_INGRESS_SECRET
        sync: false
      - key: AFTERLINK_ADMIN_TOKEN
        generateValue: true
